<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research Survey</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#survey-content">Skip to survey content</a>

    <header class="site-header" aria-labelledby="survey-title">
      <div class="container">
        <p class="survey-kicker">Research Survey</p>
        <h1 id="survey-title"></h1>
      </div>
    </header>

    <main id="survey-content" class="container survey-shell" tabindex="-1">
      <noscript>
        <section class="message-panel">
          <h2>JavaScript is required</h2>
          <p>This survey requires JavaScript to display questions and validate responses.</p>
        </section>
      </noscript>
    </main>

    <script src="/js/questionnaire.js"></script>
    <script src="/js/validation.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
